<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%" fill="none">
  <!-- Clean neutral studio canvas -->
  <rect width="400" height="480" rx="16" fill="#F4F6F8"/>
  <path d="M200 24v12M200 444v12M24 240h12M364 240h12" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Oversized T-Shirt Silhouette in Charcoal Black -->
  <g filter="drop-shadow(0 6px 16px rgba(15, 23, 42, 0.08))">
    <path d="M152 76 C170 88 230 88 248 76 L298 94 L336 172 L294 190 L274 158 L274 388 C274 394 268 400 262 400 L138 400 C132 400 126 394 126 388 L126 158 L106 190 L64 172 L102 94 Z" 
          fill="#1C1917" 
          stroke="#0C0A09" 
          stroke-width="2" 
          stroke-linejoin="round"/>
    
    <!-- Ribbed Crewneck Collar -->
    <path d="M152 76 C168 96 232 96 248 76 C238 88 162 88 152 76 Z" fill="#0C0A09"/>
    <path d="M152 76 C170 102 230 102 248 76" stroke="#292524" stroke-width="3" fill="none"/>

    <!-- Seam Lines -->
    <path d="M120 120 L152 142" stroke="#0C0A09" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M280 120 L248 142" stroke="#0C0A09" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Animal Motif Graphic Print -->
    <g transform="translate(154, 180)">
      <polygon points="46,14 26,44 66,44" fill="#292524" stroke="#44403C" stroke-width="1.5"/>
      <path d="M30 44 L46 64 L62 44" fill="#44403C"/>
      <circle cx="40" cy="34" r="2.5" fill="#F59E0B"/>
      <circle cx="52" cy="34" r="2.5" fill="#F59E0B"/>
      <text x="46" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7" font-weight="700" letter-spacing="1" fill="#D6D3D1">
        ANIMAL EDIT
      </text>
    </g>

    <line x1="130" y1="384" x2="270" y2="384" stroke="#0C0A09" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
  </g>

  <text x="200" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="1.5" fill="#64748B">
    NOBERO · PURE COTTON
