<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%" fill="none">
  <!-- Subtle studio background -->
  <rect width="400" height="480" rx="16" fill="#F4F6F8"/>
  
  <!-- Subtle grid/crosshair accents for editorial look -->
  <path d="M200 24v12M200 444v12M24 240h12M364 240h12" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Oversized T-Shirt Silhouette in Slate Blue -->
  <g filter="drop-shadow(0 6px 16px rgba(15, 23, 42, 0.08))">
    <!-- Main Shirt Body & Drop Shoulder Sleeves -->
    <path d="M152 76 C170 88 230 88 248 76 L298 94 L336 172 L294 190 L274 158 L274 388 C274 394 268 400 262 400 L138 400 C132 400 126 394 126 388 L126 158 L106 190 L64 172 L102 94 Z" 
          fill="#1E3A5F" 
          stroke="#152843" 
          stroke-width="2" 
          stroke-linejoin="round"/>
    
    <!-- Ribbed Crewneck Collar -->
    <path d="M152 76 C168 96 232 96 248 76 C238 88 162 88 152 76 Z" 
          fill="#152843"/>
    <path d="M152 76 C170 102 230 102 248 76" 
          stroke="#2A4D7A" 
          stroke-width="3" 
          fill="none"/>

    <!-- Subtle Drop-Shoulder Seam Lines -->
    <path d="M120 120 L152 142" stroke="#152843" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M280 120 L248 142" stroke="#152843" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Minimal Graphic Chest Print -->
    <g transform="translate(162, 180)">
      <rect x="0" y="0" width="76" height="48" rx="4" fill="#254B77" stroke="#3B82F6" stroke-width="1" stroke-dasharray="2 2" opacity="0.8"/>
      <!-- Graphic accent lines -->
      <path d="M12 16 H64 M12 24 H48 M12 32 H58" stroke="#93C5FD" stroke-width="2" stroke-linecap="round"/>
      <circle cx="56" cy="24" r="3" fill="#60A5FA"/>
    </g>

    <!-- Bottom Hem Accent -->
    <line x1="130" y1="384" x2="270" y2="384" stroke="#152843" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
  </g>

  <!-- Restrained Label / Tag -->
  <text x="200" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="1.5" fill="#64748B">
    NOBERO · COTTON OVERSIZED
  </text>
</svg>
